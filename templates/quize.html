<!-- templates/quiz.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap');
        * {
            padding: 0;
            margin: 0;
            font-family: "Roboto", serif;
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            width: 100%;
            background: #000000;
            color: white;
            position: relative;
        }
        .quiz-container {
            width: 80%;
            max-width: 600px;
            background: #1a1a1a;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            padding: 20px;
            color: #fff;
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            color: #FFA500;
            margin-bottom: 20px;
        }
        p {
            font-size: 1rem;
            margin: 10px 0;
        }
        .question {
            margin-bottom: 20px;
        }
        .ques{
            border-radius: 7px;
            background: rgb(44, 190, 44);
            padding: 10px;
        }
        .options {
            margin-top: 10px;
        }
        .options div {
            margin: 5px 0;
        }
        .options input {
            margin-right: 10px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #FFA500;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
        }

        .options label:hover {
            background: #ffa50022;
            transform: scale(1.02);
        }

        .options input {
            display: none;
        }

        .options input:checked + label {
            background: #FFA500;
            color: #000;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(255, 165, 0, 0.5);
        }

        button[type="submit"] {
            background: #FFA500;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button[type="submit"]:hover {
            background: #ff8700;
        }
        .no-questions {
            text-align: center;
            color: #ccc;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>Quiz for Topic: {{ topic }}</h1>

        {% if questions %}
            <form method="POST" action="/score">
                {% for question in questions %}
                    <div class="question">
                        <p class="ques">{{ loop.index }}.{{ question['Q'] }}</p>
                        <div class="options">
                            {% set qn = loop.index %}
                            {% set ops = question['O'] %}
                            {% for op in question['O'] %}
                            <div class="opp">
                                <input type="radio" id="q{{ qn }}{{ op }}" name="q{{ qn }}" required value="{{ op }}">
                                <label for="q{{ qn }}{{ op }}">{{ ops[op] }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                {% endfor %}
                <button type="submit">Submit</button>
            </form>
        {% else %}
            <div class="no-questions">
                <p>No questions available for this topic.</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
