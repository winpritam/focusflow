    <style>
        /* Circular Progress Bar */
        .circle-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 20px auto;
        }

        .circle-container svg {
            transform: rotate(-90deg);
        }

        .circle {
            fill: none;
            stroke-width: 10;
        }

        .circle-bg {
            stroke: #e6e6e6;
        }

        .circle-progress {
            stroke: #007bff;
            stroke-linecap: round;
            transition: stroke-dasharray 0.3s ease;
        }

        .circle-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
        }

        /* Horizontal Scroll Section for Courses */
        .course-section {
            gap: 10px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        /* Style for the square course cards */
        .square-card {
            width: 200px;
            height: 200px;
            flex-shrink: 0;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: #212529;
            cursor: pointer;
        }

        .square-card:first-child {
            background-color: #007bff;
            color: #fff;
        }

        /* Mobile-specific adjustments */
        @media(max-width: 768px) {
            .square-card {
                width: 22.2vw;
                height: 22.2vw;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom JS for More Menu -->
    <script>
        const toggleMoreMenu = document.getElementById('toggleMoreMenu');
        const moreMenu = document.getElementById('moreMenu');

        toggleMoreMenu.addEventListener('click', () => {
            moreMenu.classList.toggle('show'); // Toggle the "show" class
        });

        // Function to update circular progress
        function updateCircleProgress(circleId, progressTextId, value) {
            const circle = document.querySelector(`#${circleId} .circle-progress`);
            const text = document.getElementById(progressTextId);

            // Calculate stroke-dasharray
            const radius = 50;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (value / 100) * circumference;

            circle.style.strokeDasharray = `${circumference - offset} ${offset}`;
            text.textContent = `${value}%`;
        }

        // Function to update score progress bar
        function updateScoreProgress(value) {
            const progressBar = document.getElementById('scoreProgress');
            progressBar.style.width = `${value}%`;
            progressBar.setAttribute('aria-valuenow', value);
            progressBar.textContent = `${value}%`;
        }

        // Update progress dynamically
        updateCircleProgress('progressText1', 'progressText1', 75); // Course 1 - 75%
        updateCircleProgress('progressText2', 'progressText2', 60); // Course 2 - 60%
        updateCircleProgress('progressText3', 'progressText3', 45); // Course 3 - 45%
        updateScoreProgress(80); // Overall score - 80%
    </script>
